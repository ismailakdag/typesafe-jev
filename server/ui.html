<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>İlan Eleme</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --bg:#f6f7f9; --card:#fff; --ink:#15181d; --muted:#666e7a; --line:#e3e6ea;
  --ok:#1b7f4d; --warn:#b7791f; --bad:#b53535; --accent:#1f2937;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
     font:14px/1.5 -apple-system,"Segoe UI",Roboto,Helvetica,sans-serif}
header{display:flex;align-items:baseline;gap:14px;padding:16px 22px;background:var(--card);
       border-bottom:1px solid var(--line);position:sticky;top:0;z-index:500}
header h1{font-size:16px;margin:0;font-weight:650}
header .muted{color:var(--muted);font-size:13px}
.wrap{display:grid;grid-template-columns:310px 1fr;gap:20px;padding:20px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.panel h2{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
          margin:0 0 12px;font-weight:600}
label{display:block;margin:10px 0 4px;font-size:12px;color:var(--muted)}
input,textarea,select{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:7px;
      font:inherit;background:#fff;color:var(--ink)}
textarea{resize:vertical;min-height:52px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.check{display:flex;align-items:center;gap:8px;margin-top:10px}
.check input{width:auto}
button{width:100%;margin-top:14px;padding:10px;border:0;border-radius:8px;background:var(--accent);
       color:#fff;font:inherit;font-weight:600;cursor:pointer}
button:hover{background:#374151}
button:disabled{opacity:.5;cursor:default}
#map{height:190px;border-radius:8px;margin-top:10px;border:1px solid var(--line)}

.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}
.metric{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.metric .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.metric .v{font-size:21px;font-weight:650;font-variant-numeric:tabular-nums;margin-top:3px}
.metric .s{font-size:11px;color:var(--muted)}

.funnel{display:flex;gap:2px;height:9px;border-radius:5px;overflow:hidden;margin-bottom:16px;background:var(--line)}
.funnel i{display:block;height:100%;transition:width .45s ease}
.f-kod{background:#c8ccd2}.f-ele{background:#e0a8a8}.f-sor{background:#e6c88a}.f-kisa{background:#7bb894}

#log{background:#12151a;color:#cdd5df;border-radius:10px;padding:12px 14px;height:150px;
     overflow:auto;font:11.5px/1.65 ui-monospace,Menlo,Consolas,monospace;margin-bottom:18px}
#log .t{color:#6b7684}
#log .ok{color:#7bd8a4}.warn{color:#e8c37a}.bad{color:#e79a9a}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;
      display:flex;flex-direction:column;opacity:0;transform:translateY(6px);
      animation:in .28s ease forwards}
@keyframes in{to{opacity:1;transform:none}}
.card.ele{opacity:.55}
.card .thumb{height:132px;background:#eceef1 center/cover no-repeat;position:relative}
.card .thumb .ph{display:flex;height:100%;align-items:center;justify-content:center;color:#aab;font-size:12px}
.card .badge{position:absolute;top:8px;left:8px;padding:3px 8px;border-radius:20px;font-size:11px;
             font-weight:600;color:#fff;background:#555}
.badge.kisa_liste{background:var(--ok)}.badge.sana_sor{background:var(--warn)}.badge.ele{background:var(--bad)}
.badge.kod{background:#6b7280}
.card .body{padding:11px 13px;display:flex;flex-direction:column;gap:6px;flex:1}
.card .ttl{font-weight:600;font-size:13px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;
           -webkit-box-orient:vertical;overflow:hidden}
.card .meta{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.card .price{font-weight:650;font-variant-numeric:tabular-nums}
.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);transition:width .5s ease}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:11px;padding:2px 7px;border-radius:5px;background:#f1f3f5;color:var(--muted)}
.tag.bad{background:#fbeaea;color:var(--bad)}
.card .cost{margin-top:auto;padding-top:6px;border-top:1px solid var(--line);
            font:11px ui-monospace,Menlo,Consolas,monospace;color:var(--muted);
            display:flex;justify-content:space-between}
details summary{cursor:pointer;font-size:11.5px;color:var(--muted)}
details pre{font-size:10.5px;background:#f7f8fa;padding:8px;border-radius:6px;overflow:auto;max-height:200px}
.banner{background:#fdf3e3;border:1px solid #e8c37a;color:#7a5a1a;padding:10px 14px;
        border-radius:10px;margin-bottom:16px;font-size:13px}
</style>
</head>
<body>
<header>
  <h1>İlan Eleme</h1>
  <span class="muted" id="ds">yükleniyor…</span>
  <span class="muted" style="margin-left:auto" id="model"></span>
</header>

<div class="wrap">
  <aside class="panel">
    <h2>Kesin sınırlar · kod</h2>
    <div class="row2">
      <div><label>Min fiyat</label><input id="min_fiyat" type="number" placeholder="—"></div>
      <div><label>Max fiyat</label><input id="max_fiyat" type="number" value="8000000"></div>
    </div>
    <div class="row2">
      <div><label>Min m²</label><input id="min_m2" type="number" value="100"></div>
      <div><label>Max aidat</label><input id="max_aidat" type="number" value="4000"></div>
    </div>
    <div class="check"><input id="sadece_bos" type="checkbox"><label style="margin:0">Sadece boş (kiracısız)</label></div>
    <label>Merkeze uzaklık (km) — haritadan nokta seç</label>
    <input id="yaricap" type="number" step="0.5" value="10">
    <div id="map"></div>

    <h2 style="margin-top:20px">Profil · Jev</h2>
    <label>Kullanım</label>
    <textarea id="profil">Günlük kullanım, uzun vadeli oturum. İzmir Katip Çelebi Üniversitesi'ne yakınlık önemli.</textarea>
    <label>Öncelikler</label>
    <textarea id="oncelikler">Ulaşım kolaylığı, düşük aidat, taşınmaya hazır olması, site içinde güvenlik ve otopark</textarea>
    <label>Kırmızı çizgiler</label>
    <textarea id="kirmizi">Kiracılı teslim, tapu sorunu, bilgilerin çelişkili olması</textarea>
    <button id="run">Elemeyi çalıştır</button>
  </aside>

  <main>
    <div id="banner"></div>
    <div class="metrics">
      <div class="metric"><div class="k">Toplam</div><div class="v" id="m-toplam">0</div><div class="s">arşivdeki ilan</div></div>
      <div class="metric"><div class="k">Kod elemesi</div><div class="v" id="m-kod">0</div><div class="s" id="m-kod-s">—</div></div>
      <div class="metric"><div class="k">Jev kararı</div><div class="v" id="m-jev">0</div><div class="s" id="m-jev-s">—</div></div>
      <div class="metric"><div class="k">Kısa liste</div><div class="v" id="m-kisa">0</div><div class="s" id="m-kisa-s">—</div></div>
      <div class="metric"><div class="k">Maliyet</div><div class="v" id="m-usd">$0</div><div class="s" id="m-usd-s">—</div></div>
    </div>
    <div class="funnel">
      <i class="f-kod" id="f-kod" style="width:100%"></i>
      <i class="f-ele" id="f-ele" style="width:0"></i>
      <i class="f-sor" id="f-sor" style="width:0"></i>
      <i class="f-kisa" id="f-kisa" style="width:0"></i>
    </div>
    <div id="log"><span class="t">hazır.</span></div>
    <div class="grid" id="grid"></div>
  </main>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const tl = (n) => n == null ? "—" : n.toLocaleString("tr-TR") + " TL";
let ilanlar = {}, merkez = null, marker = null, cember = null;

// --- harita ---------------------------------------------------------------
const map = L.map("map").setView([38.52, 27.05], 11);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {maxZoom:18, attribution:"© OpenStreetMap"}).addTo(map);
map.on("click", (e) => setMerkez([e.latlng.lat, e.latlng.lng]));

function setMerkez(c){
  merkez = c;
  if (marker) marker.remove();
  if (cember) cember.remove();
  marker = L.marker(c).addTo(map);
  cember = L.circle(c, {radius: (+$("yaricap").value || 0) * 1000,
                        color:"#1f2937", weight:1, fillOpacity:.07}).addTo(map);
}
$("yaricap").addEventListener("input", () => merkez && setMerkez(merkez));

// --- kayit listesi --------------------------------------------------------
async function yukle(){
  const d = await (await fetch("/api/ilanlar")).json();
  ilanlar = Object.fromEntries(d.ilanlar.map(i => [i.id, i]));
  $("ds").textContent = `${d.count} ilan arşivde`;
  $("m-toplam").textContent = d.count;
  const pins = d.ilanlar.filter(i => i.coords);
  pins.forEach(i => L.circleMarker([i.coords.lat, i.coords.lon],
    {radius:4, color:"#1f2937", weight:1, fillOpacity:.6}).addTo(map).bindPopup(i.baslik ?? i.id));
  if (pins.length) map.fitBounds(pins.map(i => [i.coords.lat, i.coords.lon]), {padding:[30,30], maxZoom:13});
  if (!d.count) $("banner").innerHTML =
    '<div class="banner">Arşiv boş. Bir ilan sayfasında eklentiden <b>Kaydet</b>\'e bas, sonra bu sayfayı yenile.</div>';
  render(d.ilanlar.map(i => ({ilan:i})));
}

// --- kartlar --------------------------------------------------------------
function kart(i, karar, kod){
  const el = document.createElement("div");
  el.className = "card" + (karar?.sonuc === "ele" || kod?.gecti === false ? " ele" : "");
  el.id = "c-" + i.id;
  const f = i.fields || {};
  const rozet = karar ? karar.sonuc : (kod && !kod.gecti ? "kod" : null);
  const rozetAd = {kisa_liste:"kısa liste", sana_sor:"sana sor", ele:"elendi", kod:"kod elemesi"}[rozet] ?? "";
  const thumb = i.kapak
    ? `<div class="thumb" style="background-image:url('${i.kapak}')">`
    : `<div class="thumb"><div class="ph">görsel yok</div>`;
  const tags = [];
  if (karar) karar.bayraklar.forEach(b => tags.push(`<span class="tag bad">${b}</span>`));
  if (karar) karar.gerekce.forEach(g => tags.push(`<span class="tag">${g}</span>`));
  if (kod && !kod.gecti) tags.push(`<span class="tag bad">${kod.neden}</span>`);
  if (kod?.mesafe_km != null) tags.push(`<span class="tag">${kod.mesafe_km} km</span>`);

  el.innerHTML = `${thumb}${rozet ? `<span class="badge ${rozet}">${rozetAd}</span>` : ""}</div>
    <div class="body">
      <div class="ttl">${i.baslik ?? i.id}</div>
      <div class="price">${tl(i.fiyat_tl)}</div>
      <div class="meta">${f.m2_brut ?? "—"} m² · ${f.oda_sayisi ?? "—"} · ${f.bulundugu_kat ?? "—"}. kat
        ${f.aidat_tl ? "· aidat " + f.aidat_tl.toLocaleString("tr-TR") : ""}</div>
      ${karar ? `<div class="bar"><i style="width:${Math.round(karar.skor*100)}%"></i></div>
                 <div class="meta">uygunluk ${(karar.skor*100).toFixed(0)}%</div>` : ""}
      <div class="tags">${tags.join("")}</div>
      ${karar ? `<details><summary>ham yargılar</summary><pre>${
        JSON.stringify(karar.detay, null, 1)}</pre></details>` : ""}
      ${karar ? `<div class="cost"><span>${karar.olcum.ms} ms</span>
                 <span>${karar.olcum.input_tokens} tok</span>
                 <span>$${karar.olcum.usd.toFixed(7)}</span></div>` : ""}
    </div>`;
  return el;
}

function render(items){
  const g = $("grid"); g.innerHTML = "";
  items.forEach(({ilan, karar, kod}) => g.appendChild(kart(ilan, karar, kod)));
}

function log(msg, cls=""){
  const l = $("log");
  const t = new Date().toLocaleTimeString("tr-TR", {hour12:false});
  l.insertAdjacentHTML("beforeend", `<div><span class="t">${t}</span> <span class="${cls}">${msg}</span></div>`);
  l.scrollTop = l.scrollHeight;
}

// --- eleme akisi ----------------------------------------------------------
$("run").addEventListener("click", async () => {
  const btn = $("run"); btn.disabled = true;
  $("log").innerHTML = ""; $("grid").innerHTML = "";
  ["m-kod","m-jev","m-kisa"].forEach(k => $(k).textContent = "0");
  $("m-usd").textContent = "$0";

  const body = {
    min_fiyat: +$("min_fiyat").value || null,
    max_fiyat: +$("max_fiyat").value || null,
    min_m2: +$("min_m2").value || null,
    max_aidat: +$("max_aidat").value || null,
    sadece_bos: $("sadece_bos").checked,
    merkez, yaricap_km: merkez ? (+$("yaricap").value || null) : null,
    profil: $("profil").value, oncelikler: $("oncelikler").value,
    kirmizi_cizgiler: $("kirmizi").value,
  };

  const t0 = performance.now();
  const res = await fetch("/api/analyze", {method:"POST",
    headers:{"Content-Type":"application/json"}, body: JSON.stringify(body)});
  const reader = res.body.getReader(); const dec = new TextDecoder();
  let buf = "", kodElenen = 0, kararlar = {ele:0, sana_sor:0, kisa_liste:0}, usd = 0, toplam = 0;

  while (true){
    const {done, value} = await reader.read();
    if (done) break;
    buf += dec.decode(value, {stream:true});
    const lines = buf.split("\n"); buf = lines.pop();
    for (const raw of lines){
      if (!raw.trim()) continue;
      const e = JSON.parse(raw);

      if (e.type === "start"){ toplam = e.toplam; log(`${e.toplam} ilan yüklendi`); }

      else if (e.type === "kod"){
        const i = ilanlar[e.id];
        if (!e.gecti){ kodElenen++; $("m-kod").textContent = kodElenen;
          log(`kod elemesi · ${(i.baslik??e.id).slice(0,42)} — ${e.neden}`, "bad"); }
        $("grid").appendChild(kart(i, null, e));
      }

      else if (e.type === "kod_bitti"){
        $("m-kod-s").textContent = `${e.ms} ms · bedava`;
        $("f-kod").style.width = (100 * e.kalan / Math.max(toplam,1)) + "%";
        $("f-ele").style.width = (100 * e.elenen / Math.max(toplam,1)) + "%";
        log(`kod filtresi bitti: ${e.elenen} elendi, ${e.kalan} kaldı — ${e.ms} ms`, "ok");
      }

      else if (e.type === "jev_basladi"){
        log(`Jev'e ${e.adet} ilan gidiyor (${e.eszamanlilik} eşzamanlı)…`);
      }

      else if (e.type === "karar"){
        const i = ilanlar[e.id];
        kararlar[e.sonuc]++; usd += e.olcum.usd;
        $("m-jev").textContent = kararlar.ele + kararlar.sana_sor + kararlar.kisa_liste;
        $("m-kisa").textContent = kararlar.kisa_liste;
        $("m-usd").textContent = "$" + usd.toFixed(6);
        $("model").textContent = e.model;
        const eski = $("c-" + e.id); const yeni = kart(i, e, null);
        eski ? eski.replaceWith(yeni) : $("grid").prepend(yeni);
        const cls = e.sonuc === "kisa_liste" ? "ok" : e.sonuc === "sana_sor" ? "warn" : "bad";
        log(`${e.sonuc} · ${(i.baslik??e.id).slice(0,38)} — skor ${(e.skor*100).toFixed(0)}% · ${e.olcum.ms} ms · $${e.olcum.usd.toFixed(7)}`, cls);
        $("f-sor").style.width = (100*kararlar.sana_sor/Math.max(toplam,1))+"%";
        $("f-kisa").style.width = (100*kararlar.kisa_liste/Math.max(toplam,1))+"%";
      }

      else if (e.type === "karar_hata"){ log(`hata · ${e.baslik ?? e.id} — ${e.mesaj}`, "bad"); }
      else if (e.type === "hata"){
        $("banner").innerHTML = `<div class="banner">${e.mesaj}</div>`;
        log(e.mesaj, "bad");
      }

      else if (e.type === "bitti"){
        const o = e.ozet, gecen = (performance.now()-t0)/1000;
        const ortalama = o.jev_gorulen ? (o.jev_ms/o.jev_gorulen).toFixed(0) : 0;
        $("m-jev-s").textContent = `${(o.jev_ms/1000).toFixed(1)} sn · ort ${ortalama} ms`;
        $("m-kisa-s").textContent = `${o.sana_sor} de sana soruldu`;
        $("m-usd-s").textContent = o.jev_gorulen
          ? `1000 ilan ≈ $${(o.usd/o.jev_gorulen*1000).toFixed(3)}` : "—";
        log(`bitti — toplam ${gecen.toFixed(1)} sn, ${o.input_tokens} token, $${o.usd.toFixed(6)}`, "ok");
      }
    }
  }
  btn.disabled = false;
});

yukle();
</script>
</body>
</html>
